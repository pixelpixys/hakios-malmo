      - name: Build Flashable Android Boot / System .IMG (SM6375 / bangkk)
        run: |
          set -e
          mkdir -p out/release out/boot_staging/ramdisk
          KERNEL_BIN=$(find . -maxdepth 4 -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)

          if [ -n "$KERNEL_BIN" ]; then
            echo "Kernel encontrado en: $KERNEL_BIN"
            mkbootimg \
              --kernel "$KERNEL_BIN" \
              --ramdisk out/boot_staging/ramdisk.cpio.gz \
              --dtb out/boot_staging/bangkk.dtb \
              --base 0x00000000 \
              --pagesize 4096 \
              --kernel_offset 0x00008000 \
              --ramdisk_offset 0x01000000 \
              --dtb_offset 0x01f00000 \
              --tags_offset 0x00000100 \
              --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom androidboot.console=ttyMSM0 loop.max_part=7" \
              --header_version 2 \
              --os_version 14.0.0 \
              --os_patch_level 2024-01 \
              -o out/release/raw-${{ env.OUTPUT_IMG }}
          else
            echo "Creando imagen ext4 raw sin loop mount para bangkk..."
            truncate -s 2G out/release/raw-${{ env.OUTPUT_IMG }}
            mke2fs -t ext4 -F -L "hakios_bangkk" -d out/boot_staging/ramdisk out/release/raw-${{ env.OUTPUT_IMG }}
          fi

          img2simg out/release/raw-${{ env.OUTPUT_IMG }} out/release/${{ env.OUTPUT_IMG }}
          rm -f out/release/raw-${{ env.OUTPUT_IMG }}
          ls -lh out/release/${{ env.OUTPUT_IMG }}
          
